# Generated by ASET from the connection strings this project already
# declares. Engine versions are an assumption -- no configuration here
# states one -- pinned by digest so a run stays reproducible.
services:
  mongo:
    image: mongo@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "27017:27017"
  postgres:
    image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: northgate_toll
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d northgate_toll"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports:
      - "5432:5432"
