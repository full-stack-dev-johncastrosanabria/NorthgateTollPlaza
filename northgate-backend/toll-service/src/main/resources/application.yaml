spring:
  application:
    name: toll-service
  datasource:
    url: ${NORTHGATE_DB_URL:jdbc:postgresql://localhost:5432/northgate_toll}
    # Homebrew PostgreSQL creates a role named after your OS user; run.sh sets
    # this from `whoami`. Override for any other install.
    username: ${NORTHGATE_DB_USER:postgres}
    password: ${NORTHGATE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

northgate:
  jwt:
    # No default: the app must fail fast rather than start on a known secret.
    # See .env.example for the exports both services need.
    secret: ${NORTHGATE_JWT_SECRET}
    expiration-minutes: 480
  audit:
    base-url: ${NORTHGATE_AUDIT_URL:http://localhost:8081}
